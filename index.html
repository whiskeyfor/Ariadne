(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const colors={PERSON:'#c8bcf5',ORGANIZATION:'#9fb6d8',DOMAIN:'#b5a8d1',LOCATION:'#c4b09b',DOCUMENT:'#c7c4aa',NOTE:'#c6a9aa'};const names={PERSON:'Персоны',ORGANIZATION:'Организации',DOMAIN:'Домены',LOCATION:'Локации',DOCUMENT:'Документы',NOTE:'Заметки'};
const demoNodes=[['1','Главный вопрос',50,400],['2','Что известно',360,75],['3','Наблюдения',360,290],['4','Идеи',360,510],['5','Материалы',360,735],['6','Важная деталь',700,20],['7','Контекст',700,120],['8','Первая заметка',700,220],['9','Вторая заметка',700,320],['10','Связанные детали',700,420],['11','Гипотеза',700,520],['12','Открытый вопрос',700,620],['13','Источник',700,720],['14','Дополнительная заметка',700,820],['15','Вывод',700,920]].map(([id,title,x,y])=>({id,type:'NOTE',title,description:'',x,y,font:'Inter',size:17,color:colors.NOTE}));

const defaultProject={id:'demo-tree-v2',name:'Пример проекта',description:'Небольшая схема для знакомства с Ariadne.',nodes:demoNodes,edges:demoEdges};const clone=o=>JSON.parse(JSON.stringify(o));let projects=[clone(defaultProject)],theme='dark',storage=true;

let tabsVisible=true,inspectorVisible=true,graphControlsOpen=false,clipboardNode=null,pasteCount=0,snapGuides=[];
let page='landing',projectId=projects[0].id,tab='canvas',selected=null,selectedEdge=null,tool='select',zoom=.7,pan={x:100,y:150},history=[],connectFrom=null,menu=false,graphRotation={x:.3,y:.2},graphScale=1,filter='',graphPos={},drag=null,space=false;
function current(){return projects.find(p=>p.id===projectId)||projects[0]}function save(){try{localStorage.setItem('ariadne-graph-settings',JSON.stringify(graphSettings));localStorage.setItem('traceboard-single-v1',JSON.stringify(projects));localStorage.setItem('traceboard-single-theme',theme);storage=true}catch(e){storage=false}let el=$('#save-status');if(el)el.textContent=storage?'Сохранено':'Временная сессия'}function snapshot(){history.push(clone(projects));if(history.length>30)history.shift()}function undo(){if(history.length){projects=history.pop();selected=null;selectedEdge=null;save();renderEditor()}else toast('История действий пуста')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nodeText(n){return typeof n.text==='string'?n.text:[n.title,n.description].filter(Boolean).join('\n')}function nodeLabel(n){let t=nodeText(n).trim().split('\n')[0]||'Без текста';return t.length>34?t.slice(0,33)+'…':t}function id(){return Math.random().toString(36).slice(2,10)}function toast(text){$('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}

th d="m16 16 4 4"/>', upload:'<path d="M12 15V3m-4 4 4-4 4 4M4 17v3h16v-3"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',replay:'<path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/>'};return `<svg class="ui-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[name]||''}</svg>`}
function themeButton(){return `<button class="icon" data-action="theme" title="Сменить тему">${icon(theme==='dark'?'sun':'moon')}</button>`}function logoCard(type,title,desc,cls){return `<div class="art-card ${cls}"><small>${type}${icon('arrow')}</small><b>${title}</b><p>${desc}</p></div>`}
function renderLanding(){page='landing';syncAnimation();app.innerHTML=`<header class="nav">${brand()}<nav class="navlinks"><a href="#features">Возможности</a><a href="#how-it-works">Как это работает</a><a href="#faq">FAQ</a></nav><div class="nav-actions">${themeButton()}<button class="btn ghost" data-action="hub">Мои проекты</button><button class="btn primary" data-action="open-demo">Открыть Ariadne ${icon('arrow')}</button></div></header><section class="hero-new"><div class="hero-inner"><h1>Каждая деталь<br>имеет <em>значение.</em></h1><p>Собирайте факты, исследуйте связи и находите ответы. Всё ваше расследование — в одном спокойном пространстве.</p><div class="hero-actions"><button class="btn primary" data-action="open-demo">Начать расследование ${icon('arrow')}</button><button class="btn ghost hero-secondary" data-action="hub">Посмотреть проекты ${icon('arrow')}</button></div></div><div class="hero-visual" id="how-it-works"><div class="visual-window" aria-label="Пример схемы расследования"><div class="visual-header"><div class="visual-title"><span class="visual-icon">${icon('graph')}</span><strong>Пример проекта</strong></div><div class="visual-tabs" aria-hidden="true"><span>Доска</span><span class="v-active">Граф</span></div></div><div class="tree-preview"><svg viewBox="0 0 900 370" role="img" aria-label="Пример древовидной схемы для проекта"><g class="tree-links"><path d="M75 185 C185 185 190 55 295 55"/><path d="M75 185 C185 185 190 140 295 140"/><path d="M75 185 C185 185 190 225 295 225"/><path d="M75 185 C185 185 190 310 295 310"/><path d="M295 55 C420 55 430 35 530 35"/><path d="M295 55 C420 55 430 75 530 75"/><path d="M295 140 C420 140 430 120 530 120"/><path d="M295 140 C420 140 430 160 530 160"/><path d="M295 225 C420 225 430 205 530 205"/><path d="M295 225 C420 225 430 245 530 245"/><path d="M295 310 C420 310 430 290 530 290"/><path d="M295 310 C420 310 430 330 530 330"/></g><g class="tree-root"><circle cx="75" cy="185" r="5"/><text x="89" y="174">Главный вопрос</text></g><g class="tree-branch"><circle cx="295" cy="55" r="4"/><text x="308" y="46">Что известно</text><circle cx="295" cy="140" r="4"/><text x="308" y="131">Наблюдения</text><circle cx="295" cy="225" r="4"/><text x="308" y="216">Идеи</text><circle cx="295" cy="310" r="4"/><text x="308" y="301">Материалы</text></g><g class="tree-leaf"><circle cx="530" cy="35" r="3.5"/><text x="543" y="39">Важная деталь</text><circle cx="530" cy="75" r="3.5"/><text x="543" y="79">Контекст</text><circle cx="530" cy="120" r="3.5"/><text x="543" y="124">Первая заметка</text><circle cx="530" cy="160" r="3.5"/><text x="543" y="164">Вторая заметка</text><circle cx="530" cy="205" r="3.5"/><text x="543" y="209">Гипотеза</text><circle cx="530" cy="245" r="3.5"/><text x="543" y="249">Открытый вопрос</text><circle cx="530" cy="290" r="3.5"/><text x="543" y="294">Источник</text><circle cx="530" cy="330" r="3.5"/><text x="543" y="334">Дополнительная заметка</text></g></svg></div></div></div></section><section class="about-product" id="features"><div class="about-heading"><h2>Для мыслей, которые<br>нужно <em>связать.</em></h2><p>Здесь удобно вести расследование: записывать находки, сопоставлять данные и возвращаться к источникам.</p></div><div class="about-list"><article><span class="about-index">01</span><div><h3>Собирайте факты</h3><p>Размещайте на доске заметки, имена и ссылки. Перемещайте их и соединяйте стрелками в любом направлении.</p></div></article><article><span class="about-index">02</span><div><h3>Меняйте точку зрения</h3><p>Переключайтесь между доской, 2D- и 3D-представлением. Все они показывают один и тот же проект.</p></div></article><article><span class="about-index">03</span><div><h3>Работайте в своём темпе</h3><p>Меняйте масштаб и скорость анимации, скрывайте панели и возвращайтесь к деталям, когда они понадобятся.</p></div></article></div></section><section class="faq-section" id="faq"><div class="faq-heading"><span class="overline">СПРАВКА</span><h2>Вопросы и ответы</h2><p>Коротко о том, как устроена работа в Ariadne.</p></div><div class="faq-list"><details><summary>Где хранятся мои проекты?<span></span></summary><p>В локальном хранилище браузера на вашем устройстве. В некоторых изолированных предпросмотрах сохранение недоступно — в этом случае приложение предупредит о временной сессии.</p></details><details><summary>Как сохранить копию проекта?<span></span></summary><p>Откройте меню «Экспорт» в редакторе и выберите JSON. Позже этот файл можно импортировать обратно. Доску также можно экспортировать в PNG.</p></details><details><summary>Как добавить текст на доску?<span></span></summary><p>Дважды нажмите на пустое место доски, чтобы создать текстовый элемент.</p></details><details><summary>Как создать связь между элементами?<span></span></summary><p>Наведите на текст и перетащите круглый маркер к другому элементу. Или выберите инструмент связи и нажмите на два элемента по очереди.</p></details><details><summary>Чем отличаются 2D и 3D?<span></span></summary><p>В 2D можно перетаскивать узлы и повторять анимацию. В 3D та же сеть показана в объёмной проекции; фон можно перетаскивать для вращения. Настройки находятся в панели управления графом.</p></details><details><summary>Можно работать без интернета?<span></span></summary><p>Да. HTML-файл содержит необходимые стили и скрипты. Откройте его в браузере; доступность сохранения зависит от настроек браузера.</p></details></div></section><footer class="footer" id="about">${brand()}<span>Пространство для расследований</span><span>© 2026 Ariadne</span></footer>`}

function renderHub(query=''){page='hub';syncAnimation();app.innerHTML=`<header class="hub-head"><button data-action="landing" style="background:none;padding:0">${brand()}</button><div class="right">${themeButton()}</div></header><div class="hub-layout"><aside class="sidebar"><div class="side-title">РАБОЧЕЕ ПРОСТРАНСТВО</div><button class="side-link active">${icon('canvas')} &nbsp; Все проекты <span>${projects.length}</span></button><button class="side-link" data-action="import">${icon('upload')} &nbsp; Импорт проекта</button><div class="side-note">${storage?'Данные на вашем устройстве':'Данные временной сессии'}</div></aside><section class="hub-main"><div class="crumb">РАБОЧЕЕ ПРОСТРАНСТВО &nbsp; › &nbsp; ВСЕ ПРОЕКТЫ</div><div class="hub-title"><div><div class="eyebrow">ВАШЕ РАБОЧЕЕ ПРОСТРАНСТВО</div><h1>Расследования<span class="accent">.</span></h1><p>Все идеи, улики и связи в одном месте.</p></div><button class="btn primary" data-action="create">${icon('add')} Новое расследование</button></div><div class="hub-toolbar"><div><strong>Все проекты</strong><span class="count">${projects.length}</span></div><div class="search">${icon('search')} <input id="project-search" placeholder="Поиск расследований..." value="${esc(query)}"></div></div><div class="projects">${projects.filter(p=>p.name.toLowerCase().includes(query.toLowerCase())).map(p=>`<article class="project" data-open="${esc(p.id)}"><div class="project-cover"><span class="cover-tag">${p.id==='demo-tree-v2'?'ДЕМО-ПРОЕКТ':p.id==='demo-neutral'?'ПРЕЖНИЙ ПРИМЕР':'РАССЛЕДОВАНИЕ'}</span>${cover()}</div><div class="project-info"><div class="project-row"><span class="project-brand">${brand()}</span>${p.id!=='demo-tree-v2'?`<button type="button" class="project-delete" data-delete-project="${esc(p.id)}" title="Удалить проект" aria-label="Удалить проект ${esc(p.name)}">${icon('trash')}</button>`:''}</div><h3>${esc(p.id==='demo-neutral'?'Прежний пример':p.name)}</h3><p>${esc(p.id==='demo-neutral'?'Сохранённая копия вашего п function graphControls(){const speed=tab==='2d'?graphSettings.speed2d:graphSettings.speed3d;return `<section class="graph-controls ${graphControlsOpen?'':'hidden'}" id="graph-controls" aria-label="Настройки графа"><div class="control-head"><div><div class="control-kicker">ВИЗУАЛИЗАЦИЯ / ${tab.toUpperCase()}</div><strong>Настройки графа</strong></div><button class="collapse-controls" data-action="toggle-controls" title="Закрыть настройки" aria-label="Закрыть настройки">${icon('close')}</button></div><div class="control-content">${tab==='3d'?`<label class="graph-filter">ФИЛЬТР ПО ТЕГУ<input id="filter" placeholder="Поиск по тексту" value="${esc(filter)}"></label>`:''}<label class="range-label"><span>${tab==='2d'?'Скорость появления':'Скорость вращения'}</span><output id="speed-value">${Number(speed).toFixed(1)}×</output><input type="range" data-setting="${tab==='2d'?'speed2d':'speed3d'}" min="0.2" max="3" step="0.1" value="${speed}"></label><label class="range-label"><span>Масштаб графа</span><output id="graph-zoom-value">${Math.round(graphScale*100)}%</output><input type="range" data-setting="zoom" min="0.3" max="3" step="0.05" value="${graphScale}"></label><label class="range-label"><span>Чувствительность колеса</span><output id="sensitivity-value">${Number(graphSettings.sensitivity).toFixed(1)}×</output><input type="range" data-setting="sensitivity" min="0.2" max="3" step="0.1" value="${graphSettings.sensitivity}"></label><label class="range-label"><span>Размер узлов</span><output id="node-value">${Math.round(graphSettings.nodeSize*100)}%</output><input type="range" data-setting="nodeSize" min="0.5" max="2" step="0.1" value="${graphSettings.nodeSize}"></label><label class="range-label"><span>Прозрачность связей</span><output id="links-value">${Math.round(graphSettings.links*100)}%</output><input type="range" data-setting="links" min="0.1" max="1" step="0.05" value="${graphSettings.links}"></label><div class="control-toggles"><label><input type="checkbox" data-setting="labels" ${graphSettings.labels?'checked':''}><span>Подписи узлов</span></label>${tab==='3d'?`<label><input type="checkbox" data-setting="autoRotate" ${graphSettings.autoRotate?'checked':''}><span>Автовращение</span></label>`:''}</div><div class="control-actions">${tab==='2d'?`<button data-action="replay">${icon('replay')} Повторить анимацию</button>`:`<button data-action="reset-view">${icon('fit')} Сбросить вид</button>`}</div></div></section>`}
function syncGraphControls(){let g=$('#graph-controls');if(!g)return;let zoomInput=g.querySelector('[data-setting="zoom"]');if(zoomInput)zoomInput.value=graphScale;let out=$('#graph-zoom-value');if(out)out.textContent=Math.round(graphScale*100)+'%'}
function bindGraphControls(){let g=$('#graph-controls');if(!g)return;['pointerdown','dblclick','wheel'].forEach(type=>g.addEventListener(type,e=>e.stopPropagation()));g.querySelectorAll('[data-setting]').forEach(el=>el.addEventListener('input',()=>{let key=el.dataset.setting,val=el.type==='checkbox'?el.checked:Number(el.value);if(key==='zoom'){graphScale=val;graphSettings[tab==='2d'?'zoom2d':'zoom3d']=val;syncGraphControls()}else{graphSettings[key]=val;if(key==='speed2d'||key==='speed3d')$('#speed-value').textContent=Number(val).toFixed(1)+'×';if(key==='sensitivity')$('#sensitivity-value').textContent=Number(val).toFixed(1)+'×';if(key==='nodeSize')$('#node-value').textContent=Math.round(val*100)+'%';if(key==='links')$('#links-value').textContent=Math.round(val*100)+'%'}save();draw(key==='speed2d');syncAnimation()}))}
function syncAnimation(){if(graphRAF){cancelAnimationFrame(graphRAF);graphRAF=0}lastFrame=0;if(page!=='editor'||tab!=='3d'||!graphSettings.autoRotate)return;function tick(t){if(page!=='editor'||tab!=='3d'||!graphSettings.autoRotate){graphRAF=0;return}if(lastFrame&&(!drag||drag.kind!=='rotate')){graphRotation.y+=Math.min((t-lastFrame)/1000,.05)*graphSettings.speed3d*.35;draw()}lastFrame=t;graphRAF=requestAnimationFrame(tick)}graphRAF=requestAnimationFrame(tick)}

h-dock"><button data-action="zoom-out" title="Уменьшить" aria-label="Уменьшить">${icon('zoomOut')}</button><button data-action="zoom-in" title="Увеличить" aria-label="Увеличить">${icon('zoomIn')}</button><span></span><button data-action="fit" title="Вписать в экран" aria-label="Вписать в экран">${icon('fit')}</button>${tab==='2d'?`<button data-action="replay" title="Повторить анимацию" aria-label="Повторить анимацию">${icon('replay')}</button>`:''}<button data-action="toggle-graph-settings" title="Настройки графа" aria-label="Настройки графа" aria-expanded="${graphControlsOpen}">${icon('settings')}</button></div>`:''}</div><div class="toolbar">${[['select','select','Выделение'],['pan','pan','Перемещение'],['sep','',''],['note','text','Добавить текст'],['duplicate','copy','Дублировать выделенный элемент'],['connect','link','Связать элементы'],['sep','',''],['undo','undo','Отменить'],['help','help','Подсказки']].map(([act,iconName,title])=>act==='sep'?'<div class="tool-sep"></div>':`<button class="icon ${tool===act?'active':''}" data-action="${act}" title="${title}" aria-label="${title}">${icon(iconName)}</button>`).join('')}</div><div class="zoom-controls"><button data-action="zoom-in" title="Увеличить">${icon('zoomIn')}</button><button data-action="zoom-out" title="Уменьшить">${icon('zoomOut')}</button><button data-action="fit" title="Вписать в экран">${icon('fit')}</button></div><aside class="inspector" id="inspector"></aside></div></div>`;renderInspector();draw();let f=$('#filter');if(f)f.oninput=e=>{filter=e.target.value;draw()};bindCanvas();bindGraphControls();syncAnimation()}
function renderInspector(){let main=$('.editor-main');if(main)main.classList.toggle('has-selection',!!(selected||selectedEdge));let p=current(),n=p.nodes.find(x=>x.id===selected),e=p.edges.find(x=>x.id===selectedEdge),el=$('#inspector');if(!el)return;let header=`<div class="inspector-head"><div><div class="micro">ДЕТАЛИ</div><h3>${n?'Редактирование текста':e?'Редактирование связи':'Обзор расследования'}</h3></div>${n||e?`<button class="icon" data-action="deselect" title="Очистить выбор">${icon('close')}</button>`:''}</div>`;
if(n){el.innerHTML=header+`<div class="inspect-body"><div class="micro">СОДЕРЖАНИЕ</div><label>ТЕКСТ<textarea class="node-editor" data-node="text" placeholder="Введите текст или #тег">${esc(nodeText(n))}</textarea></label><div class="section-label">ОФОРМЛЕНИЕ</div><button class="frame-toggle ${n.boxed?'on':''}" data-action="toggle-box" aria-pressed="${!!n.boxed}">${icon('box')}<span>${n.boxed?'Убрать рамку':'Добавить рамку'}</span><span class="frame-switch"></span></button><label>ШРИФТ<select data-node="font">${['Inter','JetBrains Mono','Roboto','Montserrat','Playfair Display','Georgia','Arial'].map(t=>`<option ${n.font===t?'selected':''}>${t}</option>`).join('')}</select></label><div class="form-row"><label>РАЗМЕР<input type="number" min="9" max="30" data-node="size" value="${n.size||14}"></label><button class="btn" data-action="bold" title="Жирный" style="${n.bold?'color:var(--accent)':''}"><b>B</b></button><button class="btn" data-action="italic" title="Курсив" style="${n.italic?'color:var(--accent)':''}"><i>I</i></button></div><button class="copy-element" data-action="duplicate">${icon('copy')} Дублировать элемент <span>Ctrl D</span></button><button class="delete" data-action="delete">${icon('trash')} Удалить элемент</button></div>`;el.querySelectorAll('[data-node]').forEach(input=>{let editing=false;input.addEventListener('focus',()=>{editing=false});input.addEventListener('blur',()=>{editing=false});input.addEventListener('input',()=>{if(!editing){snapshot();editing=true}let key=input.dataset.node;n[key]=key==='size'?+input.value:input.value;save();draw()})})}
else if(e){el.innerHTML=header+`<div class="inspect-body"><div class="micro">ОФОРМЛЕНИЕ СВЯЗИ</div><label>ФОРМА ЛИНИИ<select data-edge="shape"><option value="curve" ${e.shape==='curve'?'selected':''}>Плавная кривая</option><option value="straight" ${e.shape==='straight'?'selected':''}>Прямая</option><option value="orthogonal" ${e.shape==='orthogonal'?'selected':''}>Ортогональная</option></select></label><label>СТИЛЬ ЛИНИИ<select data-edge="style"><option value="solid" ${e.style==='solid'?'selected':''}>Сплошная</option><option value="dashed" ${e.style==='dashed'?'selected':''}>Пунктирная</option><option value="dotted" ${e.style==='dotted'?'selected':''}>Точечная</option></select></label><label>НАКОНЕЧНИК<select data-edge="arrow"><option value="triangle" ${e.arrow==='triangle'?'selected':''}>Треугольник</option><option value="classic" ${e.arrow==='classic'?'selected':''}>Острая стрелка</option><option value="both" ${e.arrow==='both'?'selected':''}>Двусторонняя</option><option value="none" ${e.arrow==='none'?'selected':''}>Без наконечника</option></select></label><button class="delete" data-action="delete">${icon('trash')} Удалить связь</button></div>`;el.querySelectorAll('[data-edge]').forEach(input=>{input.addEventListener('focus',()=>input.dataset.edited='');input.addEventListener('input',()=>{if(!input.dataset.edited){snapshot();input.dataset.edited='1'}e[input.dataset.edge]=input.value;save();draw()})})}

let textMeasure=null;
function nodeWidth(n){if(!textMeasure)textMeasure=document.createElement('canvas').getContext('2d');const font=String(n.font||'Inter').replace(/["\\]/g,'');textMeasure.font=`${n.italic?'italic ':''}${n.bold?'700':'500'} ${Number(n.size)||14}px "${font}", sans-serif`;const widths=nodeText(n).split('\n').map(line=>textMeasure.measureText(line).width);return Math.max(64,Math.min(190,Math.ceil(Math.max(0,...widths))+32))}
function edgePath(a,b,shape){let x1=a.x+nodeWidth(a),y1=a.y+46,x2=b.x,y2=b.y+46;if(b.x<a.x){x1=a.x;y1=a.y+46;x2=b.x+nodeWidth(b);y2=b.y+46}let mid=(x1+x2)/2;if(shape==='straight')return `M ${x1} ${y1} L ${x2} ${y2}`;if(shape==='orthogonal')return `M ${x1} ${y1} H ${mid} V ${y2} H ${x2}`;return `M ${x1} ${y1} C ${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`}
function nodeHeight(id){let el=[...document.querySelectorAll('.node')].find(e=>e.dataset.nodeId===id);return el?el.offsetHeight:92}
function snapToOthers(n,x,y){let h=nodeHeight(n.id),bestX=null,bestY=null,threshold=7/zoom;let width=nodeWidth(n),ax=[0,width/2,width],ay=[0,h/2,h];for(const other of current().nodes){if(other.id===n.id)continue;let oh=nodeHeight(other.id),ow=nodeWidth(other),ox=[other.x,other.x+ow/2,other.x+ow],oy=[other.y,other.y+oh/2,other.y+oh];for(let i=0;i<3;i++){let dx=ox[i]-(x+ax[i]);if(Math.abs(dx)<=threshold&&(!bestX||Math.abs(dx)<Math.abs(bestX.delta)))bestX={delta:dx,coordinate:ox[i],other,otherHeight:oh};let dy=oy[i]-(y+ay[i]);if(Math.abs(dy)<=threshold&&(!bestY||Math.abs(dy)<Math.abs(bestY.delta)))bestY={delta:dy,coordinate:oy[i],other,otherHeight:oh}}}if(bestX)x+=bestX.delta;if(bestY)y+=bestY.delta;snapGuides=[];if(bestX){let o=bestX.other;snapGuides.push({x1:bestX.coordinate,y1:Math.min(y,o.y)-20,x2:bestX.coordinate,y2:Math.max(y+h,o.y+bestX.otherHeight)+20})}if(bestY){let o=bestY.other;snapGuides.push({x1:Math.min(x,o.x)-20,y1:bestY.coordinate,x2:Math.max(x+width,o.x+nodeWidth(o))+20,y2:bestY.coordinate})}return {x,y}}
function copySelected(showToast=true){const n=current().nodes.find(x=>x.id===selected);if(!n)return false;clipboardNode=clone(n);pasteCount=0;if(showToast)toast('Элемент скопирован');return true}
